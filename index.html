<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagecall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
:root {
  --ink: #111016;
  --s1: #1B1A22;
  --s2: #26242F;
  --s3: #2E2B38;
  --line: #34313F;
  --text: #F4F2F8;
  --mute: #A9A5B8;
  --accent: #F5A524; /* change this to re-color the whole app */
  --teal: #38D1BF;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #07070a;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Sans', system-ui, sans-serif;
  color: var(--text);
}
button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1, h2, p { margin: 0; }
.display { font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif; }

.app {
  width: 390px;
  height: 844px;
  max-height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--ink);
  border-radius: 28px;
}
@media (max-width: 480px) {
  body { display: block; }
  .app { width: 100vw; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; }
}

.noscroll { scrollbar-width: none; }
.noscroll::-webkit-scrollbar { display: none; }

/* header */
.header { height: 64px; flex-shrink: 0; padding: 0 16px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--s2); }
.brand { display: flex; align-items: center; gap: 10px; }
.logo { width: 28px; height: 28px; border-radius: 9px; background: var(--accent); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.brand-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.seg { display: flex; padding: 2px; border-radius: 26px; background: var(--s1); border: 1px solid var(--line); }
.seg button { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; font-size: 15px; font-weight: 700; background: transparent; color: #D8D5E2; }
.seg button.on { background: var(--accent); color: var(--ink); }

/* layout */
.content { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.scroll { position: absolute; inset: 0; overflow-y: auto; }
.pad { padding: 24px 20px 28px; }
h1.title { font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.8px; }
.sub { margin-top: 8px; font-size: 15px; line-height: 1.4; color: var(--mute); }
h2.section { margin-top: 24px; font-size: 18px; font-weight: 700; }
.label { font-size: 13px; font-weight: 700; letter-spacing: 0.8px; color: var(--mute); }

/* tab bar */
.tabbar { height: 72px; flex-shrink: 0; display: flex; border-top: 1px solid var(--s2); background: var(--ink); }
.tab { flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--mute); }
.tab.on { color: var(--accent); }

/* chips and buttons */
.row { display: flex; gap: 8px; overflow-x: auto; }
.chip { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border-radius: 22px; flex-shrink: 0; white-space: nowrap; font-size: 15px; font-weight: 600; border: 1px solid var(--line); background: var(--s2); color: var(--text); }
.chip.on { border-color: var(--accent); background: var(--accent); color: var(--ink); }
.btn { width: 100%; min-height: 46px; border-radius: 23px; font-size: 16px; font-weight: 700; border: 1px solid var(--accent); background: var(--accent); color: var(--ink); }
.btn.ghost { border-color: #5A566B; background: transparent; color: var(--text); }
.dashed { min-height: 48px; border-radius: 14px; border: 1px dashed #5A566B; background: transparent; color: #D8D5E2; font-size: 14px; font-weight: 600; }

/* venue: type buttons */
.types { margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.type { height: 118px; padding: 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--s1); color: var(--text); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; text-align: left; }
.type .ic { color: var(--accent); }
.type b { display: block; font-size: 18px; }
.type small { display: block; margin-top: 2px; font-size: 13px; color: var(--mute); }

/* cards */
.card { padding: 14px; border-radius: 20px; background: var(--s1); border: 1px solid var(--s3); display: flex; flex-direction: column; gap: 12px; }
.mine { width: 100%; padding: 14px 16px; border-radius: 16px; background: var(--s1); border: 1px solid var(--s3); display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; color: var(--text); font-size: inherit; }
.mine:hover { border-color: var(--line); background: #201F28; }
.mine .go { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--accent); }
.thumb { width: 76px; height: 76px; border-radius: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85); }
.badge { flex-shrink: 0; padding: 8px 12px; border-radius: 16px; font-size: 13px; font-weight: 700; background: var(--s2); color: var(--mute); }
.badge.on { background: var(--accent); color: var(--ink); }
.badge.booked { background: #12332E; color: var(--teal); }
.status { align-self: flex-start; padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 700; }
.status.wait { background: var(--s2); color: #D8D5E2; }
.status.ok { background: #12332E; color: var(--teal); }
.status.no { background: var(--s2); color: var(--mute); }
.btn:disabled { border-color: var(--line); background: var(--s2); color: var(--mute); }
.btn.sm { flex: 1; min-height: 44px; font-size: 15px; }
.person { padding: 12px; border-radius: 16px; background: var(--s2); display: flex; flex-direction: column; gap: 12px; }
.initials { width: 44px; height: 44px; border-radius: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; }
.banner { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: #12332E; color: var(--teal); font-size: 14px; font-weight: 600; line-height: 1.4; }
.link { border: 0; background: transparent; padding: 0; min-height: 44px; color: var(--mute); font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.travel { align-self: flex-start; padding: 6px 12px; border-radius: 14px; background: #12332E; color: var(--teal); font-size: 13px; font-weight: 700; }

/* reels */
.reels { position: absolute; inset: 0; overflow-y: auto; scroll-snap-type: y mandatory; }
.reel { position: relative; height: 100%; scroll-snap-align: start; overflow: hidden; }
.reel-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.9); }
.play { width: 80px; height: 80px; border-radius: 40px; background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; }
.kind { position: absolute; top: 80px; left: 16px; padding: 4px 10px; border-radius: 12px; background: rgba(0,0,0,0.45); font-size: 12px; font-weight: 700; letter-spacing: 1px; }
.reel-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 72px 84px 24px 20px; background: linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0)); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; color: #fff; }
.reel-info .name { font-size: 26px; font-weight: 700; line-height: 1.1; letter-spacing: -0.5px; }
.reel-cta { min-height: 44px; padding: 0 20px; border-radius: 22px; font-size: 15px; font-weight: 700; border: 2px solid var(--accent); background: var(--accent); color: var(--ink); }
.reel-cta.done { border-color: #fff; background: transparent; color: #fff; }
.heart { position: absolute; right: 16px; bottom: 36px; width: 52px; height: 52px; border-radius: 26px; border: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; color: #fff; }
.heart.on { color: #FF5C7A; }
.reel-mode { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }
.reel-mode .seg { background: rgba(17,16,22,0.78); border-color: rgba(255,255,255,0.18); pointer-events: auto; }

/* profile */
.cover { height: 140px; }
.avatar { margin-top: -42px; width: 84px; height: 84px; border: 4px solid var(--ink); background: var(--accent); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.social { min-height: 48px; border-radius: 14px; font-size: 14px; font-weight: 600; border: 1px dashed #5A566B; background: transparent; color: var(--text); }
.social.on { border: 1px solid var(--accent); background: var(--s2); }
.vid { height: 110px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #fff; }
.audio { grid-column: span 2; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--s1); border: 1px solid var(--s3); }
.bars { margin-top: 6px; display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.bars i { width: 3px; border-radius: 2px; background: #7C778C; }
.photo { height: 104px; border-radius: 12px; }
.pill { padding: 10px 14px; border-radius: 20px; background: var(--s1); border: 1px solid var(--line); font-size: 14px; }
.pill.solid { background: var(--s2); border: 0; font-weight: 600; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }

/* sheet + toast */
.overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.62); }
.overlay > .backdrop { position: absolute; inset: 0; border: 0; background: transparent; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; padding: 22px 20px 24px; border-radius: 26px 26px 0 0; background: var(--s1); border-top: 1px solid var(--line); }
.toast { position: absolute; left: 20px; right: 20px; bottom: 88px; padding: 14px 16px; border-radius: 16px; background: var(--text); color: var(--ink); font-size: 14px; font-weight: 600; line-height: 1.35; text-align: center; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }
.post-cta { width: 100%; margin-top: 16px; padding: 16px; border-radius: 18px; border: 1px dashed var(--accent); background: rgba(245,165,36,0.08); color: var(--text); display: flex; align-items: center; gap: 12px; text-align: left; }
.post-cta .ic { width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0; background: var(--accent); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.want { font-size: 18px; font-weight: 700; line-height: 1.25; }
.want em { font-style: normal; color: var(--accent); }
.toast.top { top: 76px; bottom: auto; } /* while a sheet is open, keep the toast off its buttons */
</style>
</head>

    { id: 'c4', kind: 'collab', venue: 'Rosa Vale', byLine: 'Singer · Country', bg: 'linear-gradient(135deg,#6B2C4A,#1C0E16)', type: 'Band', purpose: 'Join my act', when: 'Ongoing', pay: 'Split the door', genre: 'Country', dist: '64 mi · Pine Hollow', note: 'Booking fair season. Looking for a steady band to tour the state with.' },

  ],
  gigsView: 'venues',     // artist Gigs tab: 'venues' | 'musicians'
  collabFilter: 'All',    // Musicians board: who the post is looking for
  applied: {},
  liked: {},
  invited: {},
  linked: { ig: true, yt: false, sp: true, sc: false },
  bookings: {},           // gig id -> booked applicant id ('me' = you, the artist)
  declined: {},           // 'gigId:applicantId' -> true
  toast: ''
};

// Keep the demo between refreshes (this browser only). "Reset demo data" on Profile clears it.
var SAVE_KEY = 'stagecall-demo-v2';
var SAVED = ['role', 'tab', 'reelMode', 'filter', 'range', 'gigsView', 'collabFilter', 'gigs', 'applied', 'liked', 'invited', 'linked', 'bookings', 'declined'];
function save() {
  try {
    var out = {};
    SAVED.forEach(function (k) { out[k] = state[k]; });
    localStorage.setItem(SAVE_KEY, JSON.stringify(out));
  } catch (e) { /* storage blocked: demo still works, just resets on refresh */ }
}
function load() {
  try {
    var s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s) SAVED.forEach(function (k) { if (s[k] !== undefined) state[k] = s[k]; });
  } catch (e) { /* ignore */ }
}

function defaultForm() {
  return { date: 'Tonight', time: '9 PM', pay: '$200', genre: 'Any', reach: 'Region', travel: 'None' };
}
function defaultCollabForm() {
  return { want: 'Band', purpose: 'Backing band', date: 'Sat', pay: 'Split the door', genre: 'Any', reach: 'Region' };
}

// ---------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function chip(label, on, attrs) {
  return '<button class="chip' + (on ? ' on' : '') + '" aria-pressed="' + !!on + '" ' + attrs + '>' + esc(label) + '</button>';
}
function formChips(key, options) {
  return options.map(function (o) {
    return chip(o, state.form[key] === o, 'data-act="form" data-key="' + key + '" data-val="' + esc(o) + '"');
  }).join('');
}
function findGig(id) { return state.gigs.filter(function (g) { return g.id === id; })[0]; }
function initials(name) { return name.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }

// Everyone who applied to a gig: sample applicants plus you, if you applied as the artist.
function applicantsFor(g) {
  if (g.kind === 'collab') return g.responders || [];
  return (POOL[g.id] || []).concat(state.applied[g.id] ? [ME] : []);
}
function isCollab(g) { return g.kind === 'collab'; }
function findApplicant(gigId, appId) {
  return applicantsFor(findGig(gigId)).filter(function (a) { return a.id === appId; })[0];
}
// Where your own application stands: null | 'waiting' | 'booked' | 'passed'
function myStatus(g) {
  if (!state.applied[g.id]) return null;
  var b = state.bookings[g.id];
  if (b === 'me') return 'booked';
  if (b || state.declined[g.id + ':me']) return 'passed';
  return 'waiting';
}

var toastTimer = null;
function showToast(msg) {
  state.toast = msg;
  var live = document.getElementById('live');
  if (live) live.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { state.toast = ''; render(); }, 2800);
}

// ---------------------------------------------------------------
// Views
// ---------------------------------------------------------------
function headerView() {
  var v = state.role === 'venue';
  return '<div class="header">' +
    '<div class="brand"><div class="logo">' + icon(IC.logo, 18, 2.4) + '</div><div class="brand-name display">Stagecall</div></div>' +
    '<div class="seg" role="group" aria-label="View the app as">' +
      '<button class="' + (v ? 'on' : '') + '" aria-pressed="' + v + '" data-act="role" data-val="venue">Venue</button>' +
      '<button class="' + (!v ? 'on' : '') + '" aria-pressed="' + !v + '" data-act="role" data-val="artist">Artist</button>' +
    '</div></div>';
}

function venueGigsView() {
  var mine = state.gigs.filter(function (g) { return g.mine && !isCollab(g); });
  var list = mine.map(function (g) {
    var apps = applicantsFor(g);
    var booked = state.bookings[g.id];
    var n = apps.length;
    var badge, go;

      var who = findApplicant(g.id, booked);

    } else {
      badge = '<div class="badge' + (n > 0 ? ' on' : '') + '">' + (n === 0 ? 'No applicants yet' : (n === 1 ? '1 applied' : n + ' applied')) + '</div>';

    }

      '<div style="font-size:17px;font-weight:700">' + esc(TYPE_LABEL[g.type]) + ' wanted</div>' +
      '<div style="margin-top:3px;font-size:14px;color:var(--mute)">' + esc(g.when) + ' · ' + esc(g.genre) + '</div>' +

      '<div style="margin-top:3px;font-size:13px;color:var(--mute)">Open to ' + esc(g.reach || 'Region') + ' · ' + (g.travel ? 'Travel help: ' + esc(g.travel) : 'No travel help') + '</div>' +
      '<div class="go">' + go + '</div>' +
      '</div>' + badge + '</button>';
  }).join('');

  function typeBtn(t, ic, sub) {
    return '<button class="type" data-act="openSheet" data-val="' + t + '"><span class="ic">' + icon(ic, 32, 1.8) + '</span>' +
      '<span><b>' + TYPE_LABEL[t] + '</b><small>' + sub + '</small></span></button>';

  return '<div class="scroll noscroll pad" data-keep="venue-gigs">' +
    '<h1 class="title display">What are you looking for?</h1>' +

    '<div class="types">' +
      typeBtn('DJ', IC.dj, 'Someone to spin') +
      typeBtn('Band', IC.band, 'A full lineup') +
      typeBtn('Solo', IC.solo, 'One performer') +
      typeBtn('Singer', IC.singer, 'A vocalist') +
    '</div>' +
    '<h2 style="margin-top:32px;font-size:18px;font-weight:700">Your open gigs</h2>' +
    (mine.length === 0 ? '<p class="sub" style="font-size:14px;margin-top:10px">Nothing posted yet. Pick a type above to post your first gig.</p>' : '') +
    '<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">' + list + '</div>' +
    '</div>';
}

function artistGigsView() {
  var maxMiles = RANGE_MILES[state.range];
  if (state.gigsView === 'musicians') return musiciansView();
  var mineOnly = state.filter === 'Mine';
  var shown = state.gigs.filter(function (g) {
    if (isCollab(g)) return false;
    if (mineOnly) return !!state.applied[g.id];
    // a gig someone else already got is gone from browse, unless you applied to it
    if (state.bookings[g.id] && !state.applied[g.id]) return false;
    return (state.filter === 'All' || g.type === state.filter) && parseFloat(g.dist) <= maxMiles;
  });
  var cards = shown.map(function (g) {
    var st = myStatus(g);
    var statusTag = '', button;
    if (st === 'booked') {
      statusTag = '<div class="status ok">You’re booked. See you there!</div>';
      button = '<button class="btn" disabled>Booked</button>';
    } else if (st === 'passed') {
      statusTag = '<div class="status no">Not selected this time</div>';
      button = '<button class="btn" disabled>Spot filled</button>';
    } else if (st === 'waiting') {
      statusTag = '<div class="status wait">Applied · waiting on the venue</div>';
      button = '<button class="btn ghost" data-act="apply" data-id="' + g.id + '">Withdraw application</button>';
    } else {
      button = '<button class="btn" data-act="apply" data-id="' + g.id + '" aria-label="Apply to ' + esc(g.venue) + ', ' + esc(g.when) + '">Apply</button>';
    }
    return '<div class="card"><div style="display:flex;gap:14px">' +
      '<div class="thumb" style="background:' + THUMBS[state.gigs.indexOf(g) % THUMBS.length] + '">' + icon(IC.building, 30, 1.8) + '</div>' +
      '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">' +
        '<div style="font-size:17px;font-weight:700;line-height:1.2">' + esc(g.venue) + '</div>' +
        '<div style="font-size:14px;color:var(--mute)">' + esc(TYPE_LABEL[g.type]) + ' · ' + esc(g.genre) + '</div>' +
        '<div style="font-size:14px">' + esc(g.when) + '</div>' +
        '<div style="display:flex;align-items:center;justify-content:space-between;font-size:14px;gap:8px">' +
          '<span style="font-weight:700;color:var(--accent)">' + esc(g.pay) + '</span>' +
          '<span style="display:flex;align-items:center;gap:4px;color:var(--mute)">' + icon(IC.pin, 14) + esc(g.dist) + '</span>' +
        '</div></div></div>' +
      (g.travel ? '<div class="travel">Travel help: ' + esc(g.travel) + '</div>' : '') +
      statusTag + button +
      '</div>';
  }).join('');
  var nApplied = state.gigs.filter(function (g) { return state.applied[g.id] && !isCollab(g); }).length;

  var ranges = rangeChips();

  var filters = ['All', 'DJ', 'Band', 'Solo', 'Singer'].map(function (k) {
    return chip(k, state.filter === k, 'data-act="filter" data-val="' + k + '"');
  }).join('') + chip('My applications (' + nApplied + ')', mineOnly, 'data-act="filter" data-val="Mine"');

  var empty = mineOnly
    ? 'You haven’t applied to anything yet. Tap All to browse gigs.'
    : 'No gigs in this range yet. Try Region or Statewide to see more.';

  return '<div class="scroll noscroll" style="padding:16px 0 28px" data-keep="artist-gigs">' +
    gigsViewSwitch() +
    '<div style="padding:0 20px;margin-top:20px"><h1 class="title display">Gigs in reach</h1>' +
    '<p class="sub">Your town, your region, or anywhere in the state. Travel help shows on each gig.</p></div>' +
    '<div class="label" id="lbl-range" style="margin-top:16px;padding:0 20px">HOW FAR WILL YOU GO?</div>' +
    '<div class="row noscroll" role="group" aria-labelledby="lbl-range" style="margin-top:8px;padding:0 20px">' + ranges + '</div>' +
    '<div class="row noscroll" role="group" aria-label="Filter gigs" style="margin-top:10px;padding:0 20px">' + filters + '</div>' +
    '<div style="margin-top:16px;padding:0 20px;display:flex;flex-direction:column;gap:12px">' +
      (shown.length === 0 ? '<p class="sub" style="padding:8px 0">' + empty + '</p>' : '') +
      cards + '</div></div>';
}

function rangeChips() {
  return [
    ['Town', 'My town · 15 mi'],
    ['Region', 'My region · 75 mi'],
    ['Statewide', 'Statewide']
  ].map(function (r) { return chip(r[1], state.range === r[0], 'data-act="range" data-val="' + r[0] + '"'); }).join('');
}

// Artist Gigs tab: switch between gigs from venues and posts from other musicians.
function gigsViewSwitch() {

// How a Musicians-board post reads: "Looking for a singer"
var WANT_LABEL = { DJ: 'DJ', Band: 'band', Solo: 'solo act', Singer: 'singer' };

// Musicians board: bands looking for a singer or solo act, solo artists looking for a band, and so on.
function musiciansView() {
  var maxMiles = RANGE_MILES[state.range];
  var others = state.gigs.filter(function (g) {
    if (!isCollab(g) || g.mine) return false;
    if (state.bookings[g.id] && !state.applied[g.id]) return false;
    return (state.collabFilter === 'All' || g.type === state.collabFilter) && parseFloat(g.dist) <= maxMiles;
  });
  var mine = state.gigs.filter(function (g) { return isCollab(g) && g.mine; });

  var myPosts = mine.map(function (g) {
    var n = applicantsFor(g).length;

    return '<button class="mine" data-act="review" data-id="' + g.id + '"><div style="min-width:0">' +

      '</div>' + (who ? '<div class="badge booked">Teamed up</div>' : '<div class="badge' + (n ? ' on' : '') + '">' + (n === 0 ? 'No replies yet' : n + ' interested') + '</div>') + '</button>';
  }).join('');

  var cards = others.map(function (g) {

      '<div style="display:flex;align-items:center;gap:12px">' +

      statusTag + button + '</div>';
  }).join('');

  var filters = [['All', 'All'], ['Band', 'Need a band'], ['Solo', 'Need a solo act'], ['Singer', 'Need a singer'], ['DJ', 'Need a DJ']]
    .map(function (f) { return chip(f[1], state.collabFilter === f[0], 'data-act="collabFilter" data-val="' + f[0] + '"'); }).join('');

    (mine.length ? '<h2 class="section">Your posts</h2><div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">' + myPosts + '</div>' : '') +
    '</div>' +

        '<div><div class="vid" style="background:linear-gradient(160deg,#0E6E7E,#0A1F2E)">' + PLAY + '</div><div style="margin-top:6px;font-size:14px;font-weight:600">Live at the loft</div><div style="font-size:13px;color:var(--mute)">Video</div></div>' +
        '<div><div class="vid" style="background:linear-gradient(160deg,#9C3D2E,#2A0F14)">' + PLAY + '</div><div style="margin-top:6px;font-size:14px;font-weight:600">Rooftop session</div><div style="font-size:13px;color:var(--mute)">Video</div></div>' +
        '<div class="audio"><div style="width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg></div>' +
          '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">Demo reel</div><div class="bars">' + bars + '</div></div>' +
          '<div style="font-size:13px;color:var(--mute)">Audio</div></div>' +
        '<button class="dashed" style="min-height:64px">+ Add video</button>' +
        '<button class="dashed" style="min-height:64px">+ Add audio</button>' +
      '</div>' + resetLink() + '</div></div>';
}

function venueProfileView() {
  var photos = [
    'linear-gradient(160deg,#2C3A6B,#10131F)',
    'linear-gradient(160deg,#6B2C4A,#1C0E16)',
    'linear-gradient(160deg,#2C6B52,#0E1C16)',
    'linear-gradient(160deg,#7A5A12,#1A1408)',
    'linear-gradient(160deg,#5B2A86,#1C0F33)'
  ].map(function (b) { return '<div class="photo" style="background:' + b + '"></div>'; }).join('');

  return '<div class="scroll noscroll" style="padding-bottom:28px" data-keep="venue-profile">' +
    '<div class="cover" style="background:linear-gradient(135deg,#2C3A6B,#10131F)"></div>' +
    '<div style="padding:0 20px">' +
      '<div class="avatar" style="border-radius:22px">' + icon(IC.building, 38, 1.8) + '</div>' +
      '<h1 class="display" style="margin-top:12px;font-size:28px;font-weight:700;letter-spacing:-0.6px">The Corner Stage</h1>' +
      '<p style="margin-top:4px;font-size:15px;color:var(--mute)">Live room &amp; bar</p>' +
      '<p style="margin-top:12px;font-size:15px;line-height:1.5;color:#D8D5E2">[About the venue: the vibe, the crowd, what nights you book.]</p>' +
      '<h2 class="section">Photos</h2>' +
      '<div class="grid3" style="margin-top:12px">' + photos +
        '<button class="dashed photo" aria-label="Add photo" style="display:flex;align-items:center;justify-content:center">' + icon(IC.plus, 26) + '</button></div>' +
      '<h2 class="section">Stage &amp; sound</h2>' +
      '<div class="wrap" style="margin-top:12px"><span class="pill">Stage</span><span class="pill">PA system</span><span class="pill">Backline</span><span class="pill">DJ booth</span></div>' +
      '<h2 class="section">What we book</h2>' +
      '<div class="wrap" style="margin-top:12px"><span class="pill solid">DJ</span><span class="pill solid">Band</span><span class="pill solid">Solo musician</span><span class="pill solid">Singer</span></div>' +
      resetLink() +
    '</div></div>';
}

function resetLink() {
  return '<div style="margin-top:28px;text-align:center"><button class="link" data-act="reset">Reset demo data</button></div>';
}

function sheetView() {
  if (!state.sheet) return '';
  var k = state.sheet.kind;
  var body = k === 'review' ? reviewSheet(findGig(state.sheet.id)) : (k === 'collab' ? collabSheet() : postSheet(state.sheet.type));
  return '<div class="overlay">' +
    '<button class="backdrop" aria-label="Close" tabindex="-1" data-act="closeSheet"></button>' +
    '<div class="sheet noscroll" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-keep="sheet">' + body + '</div></div>';
}

function cancelBtn(label) {
  return '<button style="margin-top:8px;width:100%;min-height:48px;border-radius:24px;border:0;background:transparent;color:var(--mute);font-size:15px;font-weight:600" data-act="closeSheet">' + label + '</button>';
}

function field(key, label, options, first) {
  return '<div class="label" id="lbl-' + key + '" style="margin-top:' + (first ? 18 : 16) + 'px">' + label + '</div>' +
    '<div class="row noscroll" role="group" aria-labelledby="lbl-' + key + '" style="margin-top:8px">' + formChips(key, options) + '</div>';
}

function postSheet(type) {
  var f = state.form;
  return '<h2 id="sheet-title" tabindex="-1" class="display" style="font-size:24px;font-weight:700;letter-spacing:-0.5px">Post a ' + TYPE_LABEL[type] + ' gig</h2>' +
    '<p style="margin-top:4px;font-size:14px;color:var(--mute)">Choose how far to reach and whether you can help with travel.</p>' +
    field('date', 'DATE', ['Tonight', 'Tomorrow', 'Fri', 'Sat', 'Sun'], true) +
    field('time', 'START TIME', ['7 PM', '8 PM', '9 PM', '10 PM']) +
    field('pay', 'PAY', ['$100', '$150', '$200', '$300', '$500']) +
    field('genre', 'STYLE', ['Any', 'Rock', 'Country', 'Jazz', 'House', 'Acoustic', 'Blues']) +
    field('reach', 'DRAW ARTISTS FROM', ['Town', 'Region', 'Statewide']) +
    field('travel', 'TRAVEL HELP', ['None', 'Gas', 'Gas + room']) +
    // live summary so the venue sees exactly what artists will see before posting
    '<div class="card" style="margin-top:20px;gap:4px;background:var(--s2)">' +
      '<div class="label">PREVIEW</div>' +
      '<div style="font-size:16px;font-weight:700">' + esc(TYPE_LABEL[type]) + ' · ' + esc(f.genre === 'Any' ? 'Any style' : f.genre) + '</div>' +
      '<div style="font-size:14px">' + esc(f.date) + ' · ' + esc(f.time) + ' · <b style="color:var(--accent)">' + esc(f.pay) + '</b></div>' +
      '<div style="font-size:13px;color:var(--mute)">Open to ' + esc(f.reach) + ' · ' + (f.travel === 'None' ? 'No travel help' : 'Travel help: ' + esc(f.travel)) + '</div>' +
    '</div>' +
    '<button class="btn" style="margin-top:18px;min-height:52px;border-radius:26px;font-size:17px" data-act="post">Post gig</button>' +
    cancelBtn('Cancel');
}

// Musicians board: post what kind of musician you're looking for.
function collabSheet() {
  var f = state.form;
  var wantChips = ['Band', 'Solo', 'Singer', 'DJ'].map(function (t) {
    return chip(TYPE_LABEL[t], f.want === t, 'data-act="form" data-key="want" data-val="' + t + '"');
  }).join('');
  return '<h2 id="sheet-title" tabindex="-1" class="display" style="font-size:24px;font-weight:700;letter-spacing:-0.5px">Find a musician</h2>' +
    '<p style="margin-top:4px;font-size:14px;color:var(--mute)">Need a singer for your band, or a band behind your solo set? Post it here.</p>' +
    '<div class="label" id="lbl-want" style="margin-top:18px">I’M LOOKING FOR</div>' +
    '<div class="row noscroll" role="group" aria-labelledby="lbl-want" style="margin-top:8px">' + wantChips + '</div>' +
    field('purpose', 'FOR', PURPOSES) +
    field('date', 'WHEN', ['Fri', 'Sat', 'Sun', 'Flexible', 'Ongoing']) +
    field('pay', 'PAY', ['Split the door', '$100', '$150', '$200', 'Unpaid']) +
    field('genre', 'STYLE', ['Any', 'Rock', 'Country', 'Jazz', 'House', 'Acoustic', 'Blues']) +
    field('reach', 'REACH MUSICIANS IN', ['Town', 'Region', 'Statewide']) +
    '<div class="card" style="margin-top:20px;gap:4px;background:var(--s2)">' +
      '<div class="label">PREVIEW</div>' +
      '<div class="want">Looking for a <em>' + WANT_LABEL[f.want] + '</em></div>' +
      '<div style="font-size:14px">' + esc(f.purpose) + ' · ' + esc(f.date) + ' · <b style="color:var(--accent)">' + esc(f.pay) + '</b></div>' +
      '<div style="font-size:13px;color:var(--mute)">' + esc(f.genre === 'Any' ? 'Any style' : f.genre) + ' · Open to ' + esc(f.reach) + '</div>' +
    '</div>' +
    '<button class="btn" style="margin-top:18px;min-height:52px;border-radius:26px;font-size:17px" data-act="postCollab">Post</button>' +
    cancelBtn('Cancel');
}

function reviewSheet(g) {
  if (!g) return cancelBtn('Close');
  var c = isCollab(g);
  var W = c
    ? { book: 'Team up', booked: 'Teamed up', decline: 'Pass', declined: 'Passed', notSel: 'Not this time', count: ' INTERESTED', countOne: ' INTERESTED', undo: 'Undo team-up' }
    : { book: 'Book', booked: 'Booked', decline: 'Decline', declined: 'Declined', notSel: 'Not selected', count: ' APPLICANTS', countOne: ' APPLICANT', undo: 'Undo booking' };
  var apps = applicantsFor(g);
  var booked = state.bookings[g.id];
  var bookedWho = booked ? findApplicant(g.id, booked) : null;

  var rows = apps.map(function (a) {
    var key = g.id + ':' + a.id;
    var actions;
    if (booked === a.id) actions = '<div class="status ok">' + W.booked + '</div>';
    else if (state.declined[key]) actions = '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><div class="status no">' + W.declined + '</div>' +
      (booked ? '' : '<button class="link" data-act="undecline" data-id="' + g.id + '" data-val="' + a.id + '">Undo</button>') + '</div>';
    else if (booked) actions = '<div class="status no">' + W.notSel + '</div>';
    else actions = '<div style="display:flex;gap:8px">' +
      '<button class="btn ghost sm" data-act="decline" data-id="' + g.id + '" data-val="' + a.id + '" aria-label="' + W.decline + ' ' + esc(a.name) + '">' + W.decline + '</button>' +
      '<button class="btn sm" data-act="book" data-id="' + g.id + '" data-val="' + a.id + '" aria-label="' + W.book + ' with ' + esc(a.name) + '">' + W.book + '</button></div>';
    return '<div class="person"><div style="display:flex;align-items:center;gap:12px">' +
      '<div class="initials" style="background:' + a.bg + '" aria-hidden="true">' + esc(initials(a.name)) + '</div>' +
      '<div style="min-width:0"><div style="font-size:16px;font-weight:700">' + esc(a.name) + (a.id === 'me' ? ' <span style="font-size:12px;font-weight:600;color:var(--mute)">(you, from the Artist side)</span>' : '') + '</div>' +
      '<div style="font-size:14px;color:var(--mute)">' + esc(a.line) + ' · ' + esc(a.where) + '</div></div></div>' +
      actions + '</div>';
  }).join('');

  var title = c ? 'Looking for a ' + WANT_LABEL[g.type] : esc(TYPE_LABEL[g.type]) + ' wanted';
  var meta = c ? esc(g.purpose) + ' · ' + esc(g.when) : esc(g.when) + ' · ' + esc(g.genre);
  var banner = !bookedWho ? '' : c
    ? 'You’re teaming up with ' + esc(bookedWho.name) + '. Everyone else will see the spot is filled.'
    : esc(bookedWho.name) + ' is booked for this gig. The other applicants will see the spot is filled.';
  var empty = c
    ? 'No replies yet. Musicians in range will see your post on the Musicians board.'
    : 'No one has applied yet. To try it, switch to <b>Artist</b> at the top and apply to this gig.';

  return '<h2 id="sheet-title" tabindex="-1" class="display" style="font-size:24px;font-weight:700;letter-spacing:-0.5px">' + title + '</h2>' +
    '<p style="margin-top:4px;font-size:14px;color:var(--mute)">' + meta + ' · <b style="color:var(--accent)">' + esc(g.pay) + '</b></p>' +
    (banner ? '<div class="banner">' + banner + '</div>' : '') +
    '<h3 class="label" style="margin:20px 0 0">' + apps.length + (apps.length === 1 ? W.countOne : W.count) + '</h3>' +
    (apps.length === 0
      ? '<p class="sub" style="font-size:14px;margin-top:10px">' + empty + '</p>'
      : '<div style="margin-top:10px;display:flex;flex-direction:column;gap:10px">' + rows + '</div>') +
    (booked ? '<button class="btn ghost" style="margin-top:18px" data-act="unbook" data-id="' + g.id + '">' + W.undo + '</button>' : '') +
    cancelBtn('Done');
}

function tabView(key, label, ic) {
  var on = state.tab === key;
  return '<button class="tab' + (on ? ' on' : '') + '"' + (on ? ' aria-current="page"' : '') + ' data-act="tab" data-val="' + key + '">' + icon(ic, 24) + label + '</button>';
}

function view() {
  var isVenue = state.role === 'venue';
  var screen = '';
  if (state.tab === 'gigs') screen = isVenue ? venueGigsView() : artistGigsView();
  else if (state.tab === 'reels') screen = reelsView();
  else screen = isVenue ? venueProfileView() : artistProfileView();

  // while a sheet is open, everything behind it is inert (no clicks, no keyboard focus)
  var inert = state.sheet ? ' inert' : '';
  return '<div' + inert + ' style="display:contents">' + headerView() + '</div>' +
    '<main class="content"' + inert + '>' + screen + '</main>' +
    '<nav class="tabbar" aria-label="Main"' + inert + '>' + tabView('gigs', 'Gigs', IC.tabGigs) + tabView('reels', 'Reels', IC.tabReels) + tabView('profile', 'Profile', IC.tabProfile) + '</nav>' +
    sheetView() +
    (state.toast ? '<div class="toast' + (state.sheet ? ' top' : '') + '" aria-hidden="true">' + esc(state.toast) + '</div>' : '');
}

// ---------------------------------------------------------------
// Render + events
// ---------------------------------------------------------------
var root = document.getElementById('app');

// A button's identity, so keyboard focus can be put back on "the same" button after a re-render.
function sig(el) {
  if (!el || !el.dataset || !el.dataset.act) return null;
  return [el.dataset.act, el.dataset.val || '', el.dataset.id || '', el.dataset.key || ''].join('|');
}
function bySig(s) {
  if (!s) return null;
  var all = root.querySelectorAll('[data-act]');
  for (var i = 0; i < all.length; i++) if (sig(all[i]) === s) return all[i];
  return null;
}
var focusNext = null;   // 'sheet' to focus the sheet title, or a button signature

function render() {
  // remember scroll positions so lists don't jump when something changes
  var keep = {};
  root.querySelectorAll('[data-keep]').forEach(function (el) { keep[el.dataset.keep] = el.scrollTop; });
  var had = root.contains(document.activeElement) ? sig(document.activeElement) : null;
  root.innerHTML = view();
  root.querySelectorAll('[data-keep]').forEach(function (el) {
    if (keep[el.dataset.keep] != null) el.scrollTop = keep[el.dataset.keep];
  });
  // put keyboard focus back where it belongs
  var target = focusNext === 'sheet' ? document.getElementById('sheet-title') : bySig(focusNext || had);
  if (!target && focusNext && focusNext !== 'sheet') target = bySig(had);
  if (!target && state.sheet && had) target = document.getElementById('sheet-title');
  if (target) target.focus({ preventScroll: true });
  focusNext = null;
  save();
}

var sheetOpener = null;  // the button that opened the sheet, to return focus on close
function openSheet(sheet, el) {
  state.sheet = sheet;
  sheetOpener = sig(el);
  focusNext = 'sheet';
}
function closeSheet() {
  state.sheet = null;
  focusNext = sheetOpener;
}

function act(name, el) {
  var val = el.dataset.val;
  var id = el.dataset.id;
  switch (name) {
    case 'role': state.role = val; if (state.filter === 'Mine' && val === 'venue') state.filter = 'All'; break;
    case 'tab': state.tab = val; break;
    case 'mode': state.reelMode = val; break;
    case 'filter': state.filter = val; break;
    case 'range': state.range = val; break;
    case 'gigsView': state.gigsView = val; break;
    case 'collabFilter': state.collabFilter = val; break;
    case 'openSheet': state.form = defaultForm(); openSheet({ kind: 'post', type: val }, el); break;
    case 'openCollab': state.form = defaultCollabForm(); openSheet({ kind: 'collab' }, el); break;
    case 'postCollab': {
      var cf = state.form;
      var cid = 'c' + Date.now();
      // Sample replies so the review step can be tried; real replies would come from other accounts.
      var replies = (RESPONDERS[cf.want] || []).map(function (r) { return Object.assign({}, r); });
      state.gigs.push({
        id: cid, kind: 'collab', mine: true,
        venue: ME.name, byLine: ME.line, bg: ME.bg,
        type: cf.want, purpose: cf.purpose, when: cf.date, pay: cf.pay,
        genre: cf.genre, reach: cf.reach, dist: '0 mi', note: '',
        responders: replies
      });
      closeSheet();
      focusNext = 'review||' + cid + '|';
      showToast('Posted. ' + (replies.length === 1 ? '1 musician is' : replies.length + ' musicians are') + ' interested (sample replies).');
      break;
    }
    case 'review': openSheet({ kind: 'review', id: id }, el); break;
    case 'closeSheet': closeSheet(); break;
    case 'form': state.form[el.dataset.key] = val; break;
    case 'book': {
      var who = findApplicant(id, val);
      state.bookings[id] = val;
      var name = who ? who.name : 'the artist';
      if (isCollab(findGig(id))) showToast('Teaming up with ' + name + '.');
      else showToast('Booked ' + name + '.' + (val === 'me' ? ' Switch to Artist to see it.' : ''));
      focusNext = 'unbook||' + id + '|';
      break;
    }
    case 'unbook': {
      var prev = state.bookings[id];
      delete state.bookings[id];
      focusNext = 'book|' + prev + '|' + id + '|';
      break;
    }
    case 'decline': state.declined[id + ':' + val] = true; focusNext = 'undecline|' + val + '|' + id + '|'; break;
    case 'undecline': delete state.declined[id + ':' + val]; focusNext = 'decline|' + val + '|' + id + '|'; break;
    case 'reset':
      try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
      location.reload();
      return;
    case 'post': {
      var f = state.form;
      var newId = 'n' + Date.now();
      state.gigs.unshift({
        id: newId,
        venue: 'The Corner Stage',
        type: state.sheet.type,
        when: f.date + ' · ' + f.time,
        pay: f.pay,
        genre: f.genre,
        reach: f.reach,
        travel: f.travel === 'None' ? '' : f.travel,
        dist: '0.4 mi',
        mine: true,
        applicants: 0
      });
      closeSheet();
      focusNext = 'review||' + newId + '|';
      showToast('Gig posted. Switch to Artist to see how it looks.');
      break;
    }
    case 'apply': {
      var gig = findGig(id);
      if (state.applied[id]) {
        delete state.applied[id];
        delete state.declined[id + ':me'];
        showToast(gig && isCollab(gig) ? 'Interest taken back.' : 'Application withdrawn.');
      } else if (gig && isCollab(gig)) {
        state.applied[id] = true;
        showToast('Sent ' + gig.venue + ' your profile. They’ll see you’re interested.');
      } else {
        state.applied[id] = true;
        // gigs "you" posted as the venue can be reviewed on the Venue side
        if (gig) showToast('Applied to ' + gig.venue + '.' + (gig.mine ? ' Switch to Venue to review it.' : ''));
      }
      break;
    }
    case 'like': state.liked[id] = !state.liked[id]; break;
    case 'cta': {
      var reel = REELS.filter(function (r) { return r.id === id; })[0];
      var had = !!state.invited[id];
      state.invited[id] = !had;
      if (!had && reel) {
        showToast(reel.kind === 'venue' ? reel.name + ' saved.' : (state.role === 'venue' ? 'Invite sent to ' + reel.name + '.' : 'Following ' + reel.name + '.'));
      }
      break;
    }
    case 'social': state.linked[val] = !state.linked[val]; break;
  }
  render();
}

root.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || !root.contains(el)) return;
  act(el.dataset.act, el);
});

// Escape closes an open sheet
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && state.sheet) { closeSheet(); render(); }
});

load();
render();
</script>
</body>
